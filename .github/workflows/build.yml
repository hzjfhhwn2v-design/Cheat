name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test
        working-directory: core
        run: ./gradlew test --no-daemon

  forge:
    name: Forge 1.8.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle runs on 17, the mod is compiled with 8.
          java-version: |
            8
            17
      - name: Build
        working-directory: forge-1.8.9
        run: ./gradlew build --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@v4
        with:
          name: flipscout-forge-1.8.9
          path: forge-1.8.9/build/libs/*.jar
          if-no-files-found: error

  fabric:
    name: Fabric ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.8
            range: "~1.21.8"
            fabric: 0.129.0+1.21.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Available Fabric versions
        run: |
          echo "Minecraft: $(curl -s https://meta.fabricmc.net/v2/versions/game | jq -r '[.[] | select(.stable) | .version][0:12] | join(" ")')"
          echo "Loader: $(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | .version][0:5] | join(" ")')"
          echo "Fabric API: $(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -60 | tr '\n' ' ')"
          echo "Loom: $(curl -s https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -15 | tr '\n' ' ')"
      - name: Build
        working-directory: fabric
        run: >
          ./gradlew build --no-daemon --stacktrace
          -PminecraftVersion=${{ matrix.minecraft }}
          "-PminecraftRange=${{ matrix.range }}"
          -PfabricVersion=${{ matrix.fabric }}
      - uses: actions/upload-artifact@v4
        with:
          name: flipscout-fabric-${{ matrix.minecraft }}
          path: fabric/build/libs/flipscout-fabric-${{ matrix.minecraft }}-*.jar
          if-no-files-found: error
