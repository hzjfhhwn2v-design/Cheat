name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Test
        working-directory: core
        run: ./gradlew test --no-daemon

  forge:
    name: Forge 1.8.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gradle runs on 17, the mod is compiled with 8.
          java-version: |
            8
            17
      - name: Build
        working-directory: forge-1.8.9
        run: ./gradlew build --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - name: Inspect jar
        run: |
          for jar in forge-1.8.9/build/libs/*.jar; do
            echo "== $jar"
            unzip -l "$jar" | grep -E "dev/flipscout/(forge|core/FlipScout)|mcmod.info|flipscout_icon.png|certs/isrg"
            unzip -p "$jar" mcmod.info
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flipscout-forge-1.8.9
          path: forge-1.8.9/build/libs/*.jar
          if-no-files-found: error

  fabric:
    name: Fabric ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.21.x is obfuscated: remapped build targeting Java 21.
          - { minecraft: "1.21.8", range: ">=1.21.7 <=1.21.8", fabric: "0.136.1+1.21.8", dir: fabric-1.21 }
          - { minecraft: "1.21.10", range: ">=1.21.9 <=1.21.10", fabric: "0.138.4+1.21.10", dir: fabric-1.21 }
          - { minecraft: "1.21.11", range: "1.21.11", fabric: "0.141.6+1.21.11", dir: fabric-1.21 }
          # 26.x is unobfuscated: no remapping, Java 25.
          - { minecraft: "26.1.2", range: "~26.1", fabric: "0.155.3+26.1.2", dir: fabric-26 }
          - { minecraft: "26.2", range: "~26.2", fabric: "0.161.0+26.2", dir: fabric-26 }
          - { minecraft: "26.3", range: "~26.3", fabric: "0.165.0+26.3", dir: fabric-26 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Loom 1.19 runs on Java 25 even when the mod targets 21.
          java-version: 25
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: >
          ./gradlew build --no-daemon --stacktrace
          -PminecraftVersion=${{ matrix.minecraft }}
          "-PminecraftRange=${{ matrix.range }}"
          -PfabricVersion=${{ matrix.fabric }}
      - name: Inspect jar
        run: |
          for jar in ${{ matrix.dir }}/build/libs/flipscout-fabric-${{ matrix.minecraft }}-*.jar; do
            echo "== $jar"
            unzip -l "$jar" | grep -E "dev/flipscout/(fabric|core/FlipScout)|fabric.mod.json|assets/flipscout/icon.png|certs/isrg"
            unzip -p "$jar" fabric.mod.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flipscout-fabric-${{ matrix.minecraft }}
          path: ${{ matrix.dir }}/build/libs/flipscout-fabric-${{ matrix.minecraft }}-*.jar
          if-no-files-found: error
